<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Suivi de séances</title>
  <meta name="description" content="Suivi de mes séances de musculation, utilisable hors ligne.">
  <meta name="theme-color" content="#171721">
  <meta name="color-scheme" content="dark">

  <!-- Installation sur l'écran d'accueil (Android + iPhone) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Suivi">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Thème choisi, appliqué avant l'affichage (pas d'éclair sombre au lancement en mode clair) -->
  <script>
    try {
      if (localStorage.getItem('suivi_theme') === 'clair') {
        document.documentElement.dataset.theme = 'clair';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f3f7');
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'light');
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default');
      }
    } catch (e) {
      // stockage bloqué : thème sombre
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="barre">
    <div class="barre__contenu">
      <button id="bouton-retour" class="bouton-icone" type="button" aria-label="Retour à l'accueil" hidden>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="titre-ecran" class="barre__titre" tabindex="-1">Suivi</h1>
      <span id="compteur-seance" class="barre__compteur" hidden></span>
    </div>
    <div id="avancement-seance" class="barre__avancement" hidden><span></span></div>
  </header>

  <main id="contenu" class="page">
    <p id="message" class="message" role="status" hidden></p>

    <section id="ecran-accueil" class="ecran">
      <section id="semaine" class="carte semaine" aria-labelledby="titre-semaine"></section>

      <button id="bouton-sam" class="seance carte-sam" type="button">
        <span class="pastille-seance avatar-sam" aria-hidden="true">S</span>
        <span class="seance__textes">
          <span class="seance__numero">Ton coach</span>
          <span class="seance__nom">Sam</span>
          <span id="info-sam" class="seance__infos"></span>
        </span>
        <svg class="seance__fleche" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <h2 class="titre-section">Tes séances</h2>
      <ul id="liste-seances" class="liste-seances" aria-label="Séances"></ul>

      <h2 class="titre-section">Suivi</h2>
      <nav class="tuiles" aria-label="Autres écrans">
        <button id="bouton-historique" class="tuile" type="button">
          <svg class="tuile__icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          <span class="tuile__nom">Historique</span>
          <span id="info-historique" class="tuile__info"></span>
        </button>
        <button id="bouton-progression" class="tuile" type="button">
          <svg class="tuile__icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg>
          <span class="tuile__nom">Progression</span>
          <span class="tuile__info">Tes courbes</span>
        </button>
        <button id="bouton-corps" class="tuile" type="button">
          <svg class="tuile__icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 10a5 5 0 0 1 7 0"/><path d="M12 10.5l1.5-2"/></svg>
          <span class="tuile__nom">Mon corps</span>
          <span id="info-corps" class="tuile__info"></span>
        </button>
        <button id="bouton-programme" class="tuile" type="button">
          <svg class="tuile__icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
          <span class="tuile__nom">Programme</span>
          <span id="info-programme" class="tuile__info"></span>
        </button>
        <button id="bouton-sauvegarde" class="tuile" type="button">
          <svg class="tuile__icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19.5h14"/></svg>
          <span class="tuile__nom">Sauvegarde</span>
          <span id="info-sauvegarde" class="tuile__info"></span>
        </button>
      </nav>
    </section>

    <section id="ecran-seance" class="ecran" aria-labelledby="titre-ecran" hidden></section>
    <section id="ecran-bilan" class="ecran" aria-labelledby="titre-ecran" hidden></section>
    <section id="ecran-historique" class="ecran" aria-labelledby="titre-ecran" hidden></section>
    <section id="ecran-detail" class="ecran" aria-labelledby="titre-ecran" hidden></section>
    <section id="ecran-progression" class="ecran" aria-labelledby="titre-ecran" hidden></section>
    <section id="ecran-programme" class="ecran" aria-labelledby="titre-ecran" hidden></section>
    <section id="ecran-exercice" class="ecran" aria-labelledby="titre-ecran" hidden></section>
    <section id="ecran-sauvegarde" class="ecran" aria-labelledby="titre-ecran" hidden></section>
    <section id="ecran-sam" class="ecran" aria-labelledby="titre-ecran" hidden></section>
    <section id="ecran-chat" class="ecran" aria-labelledby="titre-ecran" hidden></section>
    <section id="ecran-corps" class="ecran" aria-labelledby="titre-ecran" hidden></section>
  </main>

  <footer class="pied">
    <p id="statut-hors-ligne" class="legende" role="status">Vérification du mode hors ligne…</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
